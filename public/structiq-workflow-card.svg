<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title description">
  <title id="title">StructIQ maintenance workflow overview</title>
  <desc id="description">An infrastructure maintenance portfolio demo with private workspaces, a searchable asset map, incident reports with validated photo attachments, public status tracking, maintenance notes, and audit history.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171410"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".075"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 6 4 1 7" fill="none" stroke="#ff6715" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="850" fill="url(#background)"/>
  <rect width="1280" height="850" fill="url(#grid)"/>
  <circle cx="1190" cy="34" r="210" fill="none" stroke="#ff6715" stroke-opacity=".08" stroke-width="70"/>
  <circle cx="120" cy="116" r="48" fill="#eeeeea"/>
  <g fill="none" stroke="#171717" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 142V92h31v50M96 142h48M113 104h12M113 116h12M113 128h12"/>
  </g>
