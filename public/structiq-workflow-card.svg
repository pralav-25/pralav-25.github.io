    <rect x="911" y="92" width="297" height="45" rx="5" fill="#2b1a0f" stroke="#d75a16"/>
    <text x="1059.5" y="122" text-anchor="middle" fill="#ff8846" font-size="19" font-weight="700" letter-spacing="1">WORKFLOW OVERVIEW</text>
    <text x="76" y="221" fill="#b8b6b0" font-size="32">Infrastructure maintenance, from report to resolution.</text>
  </g>
  <g fill="none" stroke="#ff6715" stroke-width="2.5" marker-end="url(#arrow)">
